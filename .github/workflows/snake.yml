name: Generate Purple Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: WhoIsVushi
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%238A2BFF&color_dots=%23240044,%23401870,%23652AB5,%238A2BFF,%23D7B8FF
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23B58AFF&color_dots=%23240044,%23401870,%23652AB5,%238A2BFF,%23D7B8FF

      - name: Publish SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
